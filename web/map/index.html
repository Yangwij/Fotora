<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>地点地图</title>
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("color-mode");
          const mode =
            stored === "light" || stored === "dark" ? stored : "auto";
          document.documentElement.dataset.colorMode = mode;
          document.documentElement.style.colorScheme =
            mode === "auto" ? "light dark" : mode;
        } catch {
          document.documentElement.dataset.colorMode = "auto";
        }
      })();
    </script>
    <link rel="stylesheet" href="./vendor/maplibre-gl.css" />
    <link rel="stylesheet" href="./map.css" />
  </head>
  <body>
    <main class="map-shell">
      <div
        id="metadataMap"
        class="metadata-map"
        role="application"
        aria-label="选择照片地点"
      ></div>

      <button
        class="map-close-button"
        id="mapCloseButton"
        type="button"
        aria-label="取消调整位置"
        title="取消"
      >
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <path d="m5 5 10 10M15 5 5 15"></path>
        </svg>
      </button>

      <button
        class="map-type-button"
        id="mapTypeToggle"
        type="button"
        aria-label="切换到卫星地图"
        title="切换到卫星地图"
      >
        <svg class="is-road-icon" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3.5" y="5" width="5" height="14" rx="1" />
          <rect x="9.5" y="3" width="5" height="18" rx="1" />
          <rect x="15.5" y="5" width="5" height="14" rx="1" />
        </svg>
        <svg class="is-satellite-icon" viewBox="0 0 24 24" aria-hidden="true">
          <g transform="rotate(45 12 12)">
            <rect x="9" y="9" width="6" height="6" rx="1.5" />
            <rect x="3.5" y="10.7" width="3.8" height="2.6" rx="0.6" />
            <rect x="16.7" y="10.7" width="3.8" height="2.6" rx="0.6" />
            <circle cx="12" cy="12" r="1.1" />
          </g>
        </svg>
      </button>

      <div class="location-controls">
        <form class="location-search" id="locationSearch" role="search">
          <div class="location-search-pill">
            <svg
              class="location-search-icon"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <circle cx="10.8" cy="10.8" r="6.2"></circle>
              <path d="m15.4 15.4 4.1 4.1"></path>
            </svg>
            <input
              id="locationSearchInput"
              type="search"
              autocomplete="off"
              spellcheck="false"
              placeholder="搜索地点或输入地址"
              aria-label="搜索地点或输入地址"
            />
            <button
              class="location-search-clear"
              id="locationSearchClear"
              type="button"
              aria-label="清除搜索"
              hidden
            >
              <svg viewBox="0 0 16 16" aria-hidden="true">
                <path d="m4 4 8 8M12 4l-8 8"></path>
              </svg>
            </button>
            <button
              class="location-search-submit"
              id="locationSearchSubmit"
              type="submit"
              aria-label="搜索"
            >
              <svg viewBox="0 0 16 16" aria-hidden="true">
                <path d="m4 8 8-4-2.4 8-1.8-3.2L4 8Z"></path>
              </svg>
            </button>
          </div>
          <div
            class="location-search-results"
            id="locationSearchResults"
            role="listbox"
            aria-label="地点搜索结果"
            hidden
          ></div>
        </form>
        <button
          class="location-confirm"
          id="mapConfirmButton"
          type="button"
          aria-label="确认并保存照片位置"
          title="确认并保存照片位置"
          disabled
          hidden
        >
          <svg viewBox="0 0 22 22" aria-hidden="true">
            <path d="m5.5 11.5 3.6 3.6 7.4-8"></path>
          </svg>
        </button>
      </div>

      <div
        class="map-notice"
        id="mapNotice"
        role="status"
        aria-live="polite"
        hidden
      ></div>
    </main>

    <script src="./vendor/maplibre-gl.js"></script>
    <script src="./drag-inertia.js"></script>
    <script src="../map-pin-icon.js"></script>
    <script src="./map.js"></script>
  </body>
</html>
