<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <style>
      html,
      body,
      iframe {
        width: 100%;
        height: 100%;
        margin: 0;
        border: 0;
      }
      output {
        position: fixed;
        top: 0;
        left: 0;
        z-index: 9999;
        max-width: 100%;
        padding: 4px 8px;
        background: #fff;
        font: 12px monospace;
      }
    </style>
  </head>
  <body>
    <output id="status">loading</output>
    <iframe id="appFrame" src="/" title="Fotora 照片栏测试"></iframe>
    <script>
      const frame = document.getElementById("appFrame");
      frame.addEventListener("load", () => {
        setTimeout(() => {
          const win = frame.contentWindow;
          const items = Array.from({ length: 220 }, (_, index) => ({
            id: index + 1,
            kind: "photo",
            name: `测试 ${index + 1}.jpg`,
            width: 3,
            height: 2,
            taken_at: 1700000000000 + index * 1000,
            gps_lat: 39.9,
            gps_lon: 116.4,
          }));
          win.eval(`
            showLocationMapButtons = true;
            state.albumMapOpen = true;
            state.albumMapItems = ${JSON.stringify(items)};
            albumMapSelectedId = 120;
            albumMapHost.hidden = false;
            albumMapHost.classList.remove("is-location-assign");
            content.hidden = true;
            renderMapFilmstrip("album");
          `);
          setTimeout(() => {
            const win = frame.contentWindow;
            const nav = win.document.getElementById("albumMapFilmstrip");
            const track = win.document.getElementById("albumMapFilmstripTrack");
            const rect = nav.getBoundingClientRect();
            document.getElementById("status").textContent = JSON.stringify({
              hidden: nav.hidden,
              className: nav.className,
              childCount: track.childElementCount,
              virtual: track.dataset.virtual,
              start: track.dataset.virtualStart,
              end: track.dataset.virtualEnd,
              paddingLeft: track.style.paddingLeft,
              scrollLeft: track.scrollLeft,
              scrollWidth: track.scrollWidth,
              clientWidth: track.clientWidth,
              rect: {
                top: rect.top,
                bottom: rect.bottom,
                left: rect.left,
                right: rect.right,
                width: rect.width,
                height: rect.height,
              },
              visibility: getComputedStyle(nav).visibility,
              display: getComputedStyle(nav).display,
              opacity: getComputedStyle(nav).opacity,
            });
          }, 1000);
        }, 1800);
      });
    </script>
  </body>
</html>
